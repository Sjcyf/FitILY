# Сборка и публикация на GitHub Pages при каждом пуше в main.
# В настройках репозитория: Settings → Pages → Source: GitHub Actions,
# Custom domain: fit.liebeily.fun.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # Сайт открывается на своём домене fit.liebeily.fun, то есть из корня, поэтому
      # BASE_PATH не задаётся. Без своего домена нужно было бы
      # BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
